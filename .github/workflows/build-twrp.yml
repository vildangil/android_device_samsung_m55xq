name: Build TWRP (Galaxy M55)

on:
  workflow_dispatch:
    inputs:
      tree_ref:
        description: Device tree branch to build
        required: true
        type: choice
        default: fix/twrp-fbe-preflight
        options:
          - fix/twrp-fbe-preflight
          - android-12.1
      NOTES:
        description: Optional note to include in Telegram updates
        required: false
        type: string
        default: ''
      TG_RECIPENT:
        description: Override Telegram chat ID (empty = CHAT_ID secret)
        required: false
        type: string
        default: ''
      VERBOSE:
        description: Send extra environment and source details
        required: true
        type: boolean
        default: true
      TG_UPLOAD:
        description: Send Odin TAR and SHA256SUMS to Telegram
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: m55xq-twrp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: TWRP 12.1 / m55xq
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      ALLOW_MISSING_DEPENDENCIES: "true"
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      TG_RECIPENT: ${{ inputs.TG_RECIPENT }}
      TG_VERBOSE: ${{ inputs.VERBOSE }}
      TG_UPLOAD: ${{ inputs.TG_UPLOAD }}
      RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}

    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v4
        with:
          ref: android-12.1
          path: ci_helpers
          persist-credentials: false

      - name: Telegram - workflow started and notes
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NOTES: ${{ inputs.NOTES }}
        run: |
          echo "TG_BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          bash "$TG" msg "gh $RUN_NUM: workflow started
          recovery: TWRP / m55xq
          device tree: ${{ inputs.tree_ref }}
          run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -n "$NOTES" ]]; then
            NOTE_ESCAPED=$(bash "$TG" escape "${NOTES:0:650}")
            bash "$TG" msg "gh $RUN_NUM: <b>notes:</b> $NOTE_ESCAPED"
          fi

      - name: Check out selected device tree
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tree_ref }}
          path: device_tree
          persist-credentials: false

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache \
            /usr/local/lib/node_modules
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop pngcrush rsync \
            squashfs-tools xsltproc zip unzip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore compilation cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: m55xq-twrp12-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            m55xq-twrp12-${{ runner.os }}-

      - name: Telegram - build environment ready
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          if [[ "$TG_VERBOSE" == "true" ]]; then
            OS=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"')
            FREE=$(df -m --output=avail / | tail -1 | tr -d ' ')
            bash "$TG" msg "gh $RUN_NUM: build env initialized
            host: $OS
            free disk space: ${FREE} MB
            runner CPUs: $(nproc)"
          fi

      - name: Telegram - syncing recovery source
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "TG_SYNC_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          bash "$TG" msg "gh $RUN_NUM: cloning recovery source
          manifest: minimal-manifest-twrp/platform_manifest_twrp_aosp
          branch: twrp-12.1"

      - name: Initialize and sync minimal TWRP 12.1 sources
        id: sync
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          repo sync -c --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune -j"$(nproc)"
          df -h /

      - name: Telegram - sources synced
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          SYNC_TIME=$(( $(date +%s) - TG_SYNC_STARTED ))
          bash "$TG" msg "gh $RUN_NUM: source sync completed in $((SYNC_TIME / 60))m $((SYNC_TIME % 60))s"

      - name: Install M55 and Qualcomm recovery trees
        id: device
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp/device/samsung" \
                   "$GITHUB_WORKSPACE/twrp/device/qcom"
          cp -a "$GITHUB_WORKSPACE/device_tree" \
            "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq"
          rm -rf "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/.git" \
                 "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/.github"
          # twrp-default.xml already syncs TeamWin's qcom/twrp-common.
          # Cloning it again fails because this directory is nonempty.
          echo "Using Qualcomm TWRP common from repo sync"
          test -f "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/BoardConfig.mk"
          test -f "$GITHUB_WORKSPACE/twrp/device/qcom/twrp-common/Android.mk"

      - name: Telegram - device info and compilation
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TREE_REF: ${{ inputs.tree_ref }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          DEVICE_SHA=$(git -C "$GITHUB_WORKSPACE/device_tree" rev-parse --short HEAD)
          if [[ "$TG_VERBOSE" == "true" ]]; then
            bash "$TG" msg "gh $RUN_NUM: device m55xq
            tree branch: $TREE_REF
            tree commit: <code>$DEVICE_SHA</code>
            source: TWRP 12.1"
          fi
          echo "TG_COMPILE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          bash "$TG" msg "gh $RUN_NUM: running compilation script(s): recoveryimage"

      - name: Build recovery.img
        id: compile
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/twrp"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          export PATH="$JAVA_HOME/bin:$PATH"
          export LC_ALL=C
          # Capture setup and compilation failures in one log.
          {
            # Some device vendorsetup.sh files return 1 even when successfully sourced.
            set +e
            source build/envsetup.sh
            set -e
            type lunch >/dev/null || { echo "::error::envsetup did not define lunch"; exit 1; }
            lunch twrp_m55xq-eng
            mka recoveryimage -j"$(nproc)"
          } 2>&1 | tee "$RUNNER_TEMP/twrp-build.log"
          ccache -s
          df -h /

      - name: Verify image and create Odin archive
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE="$GITHUB_WORKSPACE/twrp/out/target/product/m55xq/recovery.img"
          test -s "$IMAGE"
          IMAGE_SIZE=$(stat -c '%s' "$IMAGE")
          PARTITION_SIZE=112070656
          if (( IMAGE_SIZE > PARTITION_SIZE )); then
            echo "::error::recovery.img exceeds BOARD_RECOVERYIMAGE_PARTITION_SIZE"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$IMAGE" "$GITHUB_WORKSPACE/artifacts/recovery.img"
          cd "$GITHUB_WORKSPACE/artifacts"
          tar -cf twrp-m55xq-odin.tar recovery.img
          sha256sum recovery.img twrp-m55xq-odin.tar > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Telegram - build output ready
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          COMPILE_TIME=$(( $(date +%s) - TG_COMPILE_STARTED ))
          HASH=$(sha256sum "$GITHUB_WORKSPACE/artifacts/recovery.img" | cut -d' ' -f1)
          bash "$TG" msg "gh $RUN_NUM: recoveryimage compiled in $((COMPILE_TIME / 60))m $((COMPILE_TIME % 60))s
          image SHA256: <code>$HASH</code>
          uploading artifacts..."

      - name: Upload recovery
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: twrp-m55xq-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Upload logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-m55xq-failure-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/twrp-build.log
            twrp/out/verbose.log.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

      - name: Telegram - upload recovery and checksums
        if: ${{ success() && inputs.TG_UPLOAD }}
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          bash "$TG" msg "gh $RUN_NUM: uploading Odin TAR and checksums to Telegram"
          bash "$TG" up "$GITHUB_WORKSPACE/artifacts/twrp-m55xq-odin.tar" \
            "gh $RUN_NUM: TWRP m55xq Odin TAR (untested)"
          bash "$TG" up "$GITHUB_WORKSPACE/artifacts/SHA256SUMS" \
            "gh $RUN_NUM: SHA256SUMS"

      - name: Telegram - send failure log
        if: ${{ failure() }}
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          if [[ -s "$RUNNER_TEMP/twrp-build.log" ]]; then
            gzip -c "$RUNNER_TEMP/twrp-build.log" > "$RUNNER_TEMP/twrp-build.log.gz"
            bash "$TG" up "$RUNNER_TEMP/twrp-build.log.gz" \
              "gh $RUN_NUM: failed TWRP build log"
          fi

      - name: Telegram - final result
        if: ${{ always() }}
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          JOB_RESULT: ${{ job.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          NOW=$(date +%s)
          if [[ "${TG_BUILD_STARTED:-}" =~ ^[0-9]+$ ]]; then
            ELAPSED=$((NOW - TG_BUILD_STARTED))
            DURATION="$((ELAPSED / 60))m $((ELAPSED % 60))s"
          else
            DURATION="unavailable"
          fi
          if [[ "$JOB_RESULT" == "success" ]]; then
            MESSAGE=$(printf 'gh %s: workflow ended in %s\nstatus: <b>SUCCESS</b>\nartifact: <code>twrp-m55xq-%s</code>\n<a href="%s/%s/actions/runs/%s">Download from GitHub Actions</a>' \
              "$RUN_NUM" "$DURATION" "$GITHUB_RUN_NUMBER" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          else
            STAGE="environment / checkout"
            if [[ "$SYNC_OUTCOME" == "failure" ]]; then STAGE="source sync"
            elif [[ "$DEVICE_OUTCOME" == "failure" ]]; then STAGE="device tree"
            elif [[ "$COMPILE_OUTCOME" == "failure" ]]; then STAGE="recovery compilation"
            elif [[ "$PACKAGE_OUTCOME" == "failure" ]]; then STAGE="image packaging"
            elif [[ "$UPLOAD_OUTCOME" == "failure" ]]; then STAGE="artifact upload"
            fi
            MESSAGE=$(printf 'gh %s: workflow %s in %s\nstage: %s\n<a href="%s/%s/actions/runs/%s">Open build logs</a>' \
              "$RUN_NUM" "$JOB_RESULT" "$DURATION" "$STAGE" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          fi
          bash "$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh" "$MESSAGE"
