name: Build TWRP (Galaxy M55)

on:
  workflow_dispatch:
    inputs:
      tree_ref:
        description: Device tree branch to build
        required: true
        type: choice
        default: fix/twrp-fbe-preflight
        options:
          - fix/twrp-fbe-preflight
          - fix/twrp-weaver-hermes
          - test/twrp-f55-may2026-spl
          - test/twrp-auto-spl
          - android-12.1
      NOTES:
        description: Optional note to include in Telegram updates
        required: false
        type: string
        default: ''
      TG_RECIPENT:
        description: Override Telegram chat ID (empty = CHAT_ID secret)
        required: false
        type: string
        default: ''
      VERBOSE:
        description: Send extra environment and source details
        required: true
        type: boolean
        default: true
      TG_UPLOAD:
        description: Send Odin TAR and SHA256SUMS to Telegram
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: m55xq-twrp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: TWRP 12.1 / m55xq
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      ALLOW_MISSING_DEPENDENCIES: "true"
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      TG_RECIPENT: ${{ inputs.TG_RECIPENT }}
      TG_VERBOSE: ${{ inputs.VERBOSE }}
      TG_UPLOAD: ${{ inputs.TG_UPLOAD }}
      RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}

    steps:
      - name: Check out CI helpers
        uses: actions/checkout@v4
        with:
          ref: android-12.1
          path: ci_helpers
          persist-credentials: false

      - name: Telegram - workflow started and notes
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NOTES: ${{ inputs.NOTES }}
        run: |
          echo "TG_BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          bash "$TG" msg "gh $RUN_NUM: workflow started"
          if [[ -n "$NOTES" ]]; then
            NOTE_ESCAPED=$(bash "$TG" escape "${NOTES:0:650}")
            bash "$TG" msg "gh $RUN_NUM: $NOTE_ESCAPED"
          fi

      - name: Check out selected device tree
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tree_ref }}
          path: device_tree
          persist-credentials: false

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache \
            /usr/local/lib/node_modules
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop pngcrush rsync \
            squashfs-tools xsltproc zip unzip zlib1g-dev python3 \
            python-is-python3 python3-pip openjdk-11-jdk-headless
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore compilation cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: m55xq-twrp12-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            m55xq-twrp12-${{ runner.os }}-

      - name: Telegram - build environment ready
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [[ "$TG_VERBOSE" == "true" ]]; then
            TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
            OS=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2-)
            FREE=$(df -BM --output=avail / | tail -1 | tr -d ' ')
            bash "$TG" msg "gh $RUN_NUM: build env initialized%nlgh $RUN_NUM: host: $OS%nlgh $RUN_NUM: free disk space: $FREE"
          fi

      - name: Telegram - syncing recovery source
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [[ "$TG_VERBOSE" == "true" ]]; then
            TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
            bash "$TG" msg "gh $RUN_NUM: cloning recovery source%nlgh $RUN_NUM: repo: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp%nlgh $RUN_NUM: branch: twrp-12.1"
          fi

      - name: Initialize and sync minimal TWRP 12.1 sources
        id: sync
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          # Upstream android.googlesource.com sometimes returns HTTP 503.
          # repo sync is incremental; retries reuse already-downloaded projects.
          SYNC_ARGS=( -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune )
          if ! repo sync "${SYNC_ARGS[@]}" -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/twrp-sync.log"; then
            echo "::warning::Initial repo sync failed; retrying remaining projects in 20 seconds"
            sleep 20
            if ! repo sync "${SYNC_ARGS[@]}" -j2 2>&1 | tee -a "$RUNNER_TEMP/twrp-sync.log"; then
              echo "::warning::Second repo sync failed; final retry with one network job"
              sleep 40
              repo sync "${SYNC_ARGS[@]}" -j1 --fail-fast 2>&1 | tee -a "$RUNNER_TEMP/twrp-sync.log"
            fi
          fi
          df -h /

      - name: Install M55 and Qualcomm recovery trees
        id: device
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp/device/samsung" \
                   "$GITHUB_WORKSPACE/twrp/device/qcom"
          cp -a "$GITHUB_WORKSPACE/device_tree" \
            "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq"
          rm -rf "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/.git" \
                 "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/.github"
          # twrp-default.xml already syncs TeamWin's qcom/twrp-common.
          # Cloning it again fails because this directory is nonempty.
          echo "Using Qualcomm TWRP common from repo sync"
          test -f "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/BoardConfig.mk"
          test -f "$GITHUB_WORKSPACE/twrp/device/qcom/twrp-common/Android.mk"
          # Fail quickly rather than compiling a recovery that advertises
          # Weaver but cannot launch Samsung's actual Hermes service.
          if [[ "${{ inputs.tree_ref }}" == "fix/twrp-weaver-hermes" || "${{ inputs.tree_ref }}" == "test/twrp-f55-may2026-spl" || "${{ inputs.tree_ref }}" == "test/twrp-auto-spl" ]]; then
            for blob in \
              vendor/bin/hermesd \
              vendor/lib64/android.hardware.weaver@1.0.so \
              vendor/lib64/libhwvault.so \
              vendor/lib64/libshctrl.so \
              vendor/lib64/libese-grdg.so \
              vendor/lib64/libhermes_bdbridge.so \
              vendor/lib64/vendor.samsung.hardware.security.drk-V1-ndk_platform.so \
              vendor/lib64/vendor.samsung.hardware.security.drk@2.0.so \
              vendor/lib64/vendor.samsung.hardware.security.hermes-V1-ndk_platform.so \
              vendor/etc/secnvm/k250a_47000301_0.img \
              vendor/etc/secnvm/k250a_47000305_c.img \
              vendor/etc/secnvm/k250a_47000306_1.img; do
              if [[ ! -s "$GITHUB_WORKSPACE/device_tree/recovery/root/$blob" ]]; then
                echo "::error::Missing stock Hermes blob: recovery/root/$blob. Apply the provided user-side ZIP installer before building this branch."
                exit 1
              fi
            done
            test -x "$GITHUB_WORKSPACE/device_tree/recovery/root/vendor/bin/hermesd" || {
              echo "::error::Hermes executable has no +x Git file mode"
              exit 1
            }
            if [[ "${{ inputs.tree_ref }}" == "test/twrp-auto-spl" ]]; then
              test -s "$GITHUB_WORKSPACE/device_tree/recovery/root/system/bin/twrp-keymint-spl.sh" || {
                echo "::error::Missing dynamic KeyMint SPL detector"
                exit 1
              }
              grep -q 'start twrp-keymint-spl' "$GITHUB_WORKSPACE/device_tree/recovery/root/init.recovery.qcom.rc" || {
                echo "::error::KeyMint auto-SPL init hook missing"
                exit 1
              }
            fi
          fi
          # Reject accidental TeamWin fallback at every build stage.
          grep -Eq '^TW_DEVICE_VERSION[[:space:]]*:=[[:space:]]*VildanG[[:space:]]*$' \
            "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/BoardConfig.mk"
          grep -Eq '^PRODUCT_SHIPPING_API_LEVEL[[:space:]]*:=[[:space:]]*30[[:space:]]*$' \
            "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/device.mk"
          for file in BoardConfig.mk device.mk recovery/root/init.recovery.qcom.rc; do
            cmp -s "$GITHUB_WORKSPACE/device_tree/$file" \
              "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/$file" || {
                echo "::error::Wrong device tree before lunch: $file"
                exit 1
              }
          done

      - name: Telegram - device info and compilation
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          DEVICE_SHA=$(git -C "$GITHUB_WORKSPACE/device_tree" rev-parse --short HEAD)
          bash "$TG" msg "gh $RUN_NUM: recovery name: TWRP%nlgh $RUN_NUM: recovery ver: 12.1%nlgh $RUN_NUM: recovery head commit: <code>$DEVICE_SHA</code>%nlgh $RUN_NUM: device: m55xq"
          echo "TG_COMPILE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          bash "$TG" msg "gh $RUN_NUM: running compilation script(s): recoveryimage"

      - name: Build recovery.img
        id: compile
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/twrp"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          export PATH="$JAVA_HOME/bin:$PATH"
          export LC_ALL=C
          # Capture setup and compilation failures in one log.
          {
            # Some device vendorsetup.sh files return 1 even when successfully sourced.
            set +e
            source build/envsetup.sh
            set -e
            type lunch >/dev/null || { echo "::error::envsetup did not define lunch"; exit 1; }
            # lunch MUST run in this shell: a pipe to tee would run it in a
            # subshell and discard TARGET_PRODUCT/TARGET_BUILD_VARIANT exports.
            # Store its output first, then print it so the environment survives.
            if lunch twrp_m55xq-eng > "$RUNNER_TEMP/twrp-lunch.log" 2>&1; then
              cat "$RUNNER_TEMP/twrp-lunch.log"
            else
              cat "$RUNNER_TEMP/twrp-lunch.log"
              echo "::error::lunch failed"
              exit 1
            fi
            if [[ "${TARGET_PRODUCT:-}" != "twrp_m55xq" || "${TARGET_BUILD_VARIANT:-}" != "eng" ]]; then
              echo "::error::lunch did not preserve TWRP device selection"
              exit 1
            fi
            # Some TWRP lunch scripts silently fetch TeamWin's device tree
            # when dumpvars fails; detect it even when lunch exits with 0.
            if grep -Eq 'dumpvars failed|Device m55xq not found|Attempting to retrieve device repository' \
              "$RUNNER_TEMP/twrp-lunch.log"; then
              echo "::error::lunch failed or used TeamWin tree fallback"
              exit 1
            fi
            for file in BoardConfig.mk device.mk recovery/root/init.recovery.qcom.rc; do
              cmp -s "$GITHUB_WORKSPACE/device_tree/$file" \
                "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/$file" || {
                  echo "::error::Device tree changed during lunch: $file"
                  exit 1
                }
            done
            grep -Eq '^TW_DEVICE_VERSION[[:space:]]*:=[[:space:]]*VildanG[[:space:]]*$' \
              device/samsung/m55xq/BoardConfig.mk
            mka recoveryimage -j"$(nproc)"
          } 2>&1 | tee "$RUNNER_TEMP/twrp-build.log"
          ccache -s
          df -h /

      - name: Verify image and create Odin archive
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE="$GITHUB_WORKSPACE/twrp/out/target/product/m55xq/recovery.img"
          test -s "$IMAGE"
          IMAGE_SIZE=$(stat -c '%s' "$IMAGE")
          PARTITION_SIZE=112070656
          if (( IMAGE_SIZE > PARTITION_SIZE )); then
            echo "::error::recovery.img exceeds BOARD_RECOVERYIMAGE_PARTITION_SIZE"
            exit 1
          fi
          for file in BoardConfig.mk device.mk recovery/root/init.recovery.qcom.rc; do
            cmp -s "$GITHUB_WORKSPACE/device_tree/$file" \
              "$GITHUB_WORKSPACE/twrp/device/samsung/m55xq/$file" || {
                echo "::error::Wrong device tree after compilation: $file"
                exit 1
              }
          done
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          {
            echo "Recovery: TWRP / m55xq / VildanG"
            echo "Tree ref: ${{ inputs.tree_ref }}"
            echo "Tree SHA: $(git -C "$GITHUB_WORKSPACE/device_tree" rev-parse HEAD)"
            echo "Actions run: $GITHUB_RUN_ID"
          } > "$GITHUB_WORKSPACE/artifacts/BUILD_INFO.txt"
          cp "$IMAGE" "$GITHUB_WORKSPACE/artifacts/recovery.img"
          cd "$GITHUB_WORKSPACE/artifacts"
          tar -cf twrp-m55xq-odin.tar recovery.img
          sha256sum recovery.img twrp-m55xq-odin.tar > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Upload recovery
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: twrp-m55xq-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Upload logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-m55xq-failure-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/twrp-build.log
            ${{ runner.temp }}/twrp-lunch.log
            ${{ runner.temp }}/twrp-sync.log
            twrp/out/verbose.log.gz
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

      - name: Telegram - upload recovery and checksums
        if: ${{ success() && inputs.TG_UPLOAD }}
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"
          COMPILE_TIME=$(( $(date +%s) - TG_COMPILE_STARTED ))
          MD5=$(md5sum "$ARTIFACT_DIR/twrp-m55xq-odin.tar" | cut -d' ' -f1)
          CAPTION=$(printf 'build succeeded in %dm, %ds%%nlmd5: <code>%s</code>%%nlrecovery: TWRP 12.1 / m55xq' \
            "$((COMPILE_TIME / 60))" "$((COMPILE_TIME % 60))" "$MD5")
          bash "$TG" up "$ARTIFACT_DIR/twrp-m55xq-odin.tar" "$CAPTION"
          bash "$TG" up "$ARTIFACT_DIR/SHA256SUMS" "gh $RUN_NUM: SHA256SUMS"

      - name: Telegram - send failure log
        if: ${{ failure() }}
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          NOW=$(date +%s)
          if [[ "${TG_BUILD_STARTED:-}" =~ ^[0-9]+$ ]]; then
            ELAPSED=$((NOW - TG_BUILD_STARTED))
            CAPTION="build failed in $((ELAPSED / 60))m, $((ELAPSED % 60))s"
          else
            CAPTION="build failed"
          fi
          if [[ -s "$RUNNER_TEMP/twrp-build.log" ]]; then
            gzip -c "$RUNNER_TEMP/twrp-build.log" > "$RUNNER_TEMP/twrp-build.log.gz"
            bash "$TG" up "$RUNNER_TEMP/twrp-build.log.gz" "$CAPTION%nlrecovery: TWRP 12.1 / m55xq"
          elif [[ -s "$RUNNER_TEMP/twrp-sync.log" ]]; then
            gzip -c "$RUNNER_TEMP/twrp-sync.log" > "$RUNNER_TEMP/twrp-sync.log.gz"
            bash "$TG" up "$RUNNER_TEMP/twrp-sync.log.gz" "$CAPTION%nlstage: source sync"
          fi

      - name: Telegram - final result
        if: ${{ always() }}
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          JOB_RESULT: ${{ job.status }}
        run: |
          NOW=$(date +%s)
          if [[ "${TG_BUILD_STARTED:-}" =~ ^[0-9]+$ ]]; then
            ELAPSED=$((NOW - TG_BUILD_STARTED))
            DURATION="$((ELAPSED / 60))m, $((ELAPSED % 60))s"
          else
            DURATION="unknown time"
          fi
          TG="$GITHUB_WORKSPACE/ci_helpers/.github/scripts/telegram-notify.sh"
          if [[ "$JOB_RESULT" == "success" ]]; then
            bash "$TG" msg "gh $RUN_NUM: workflow ended in $DURATION"
          elif [[ "$JOB_RESULT" == "cancelled" ]]; then
            bash "$TG" msg "gh $RUN_NUM: workflow cancelled in $DURATION"
          else
            bash "$TG" msg "gh $RUN_NUM: workflow failed in $DURATION"
          fi

